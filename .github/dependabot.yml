version: 2
updates:
  # Maintain GitHub Actions workflow dependencies (supply-chain security)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    reviewers:
      - "raklabs"
    assignees:
      - "raklabs"
    labels:
      - "dependencies"
      - "security"

  # Maintain Python microservice dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    reviewers:
      - "raklabs"
    assignees:
      - "raklabs"
    labels:
      - "dependencies"
      - "python"
