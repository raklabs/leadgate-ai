name: CI — Spec Verification, Security & Test Suite

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    name: Spec Compliance, Security Audit & Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Security Gate — Verify no secrets or .env files committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env file must never be committed to git!"
            exit 1
          fi
          if grep -RInE "sk-(proj|ant)-[A-Za-z0-9_-]{20,}" app/ tests/ scripts/ config/ 2>/dev/null; then
            echo "ERROR: Potential hardcoded LLM API key detected!"
            exit 1
          fi

      - name: Bytecode & Syntax Verification
        run: .venv/bin/python -m compileall -q app scripts tests

      - name: Run Automated Test Suite (Unit, Integration & Security)
        run: .venv/bin/pytest

      - name: Run 20 Historical Enquiries Benchmark
        run: .venv/bin/python scripts/evaluate_20_enquiries.py --provider deterministic_local --export-docs

  dependabot-triage:
    name: Automated Dependabot Triage & App Verification Gate
    needs: verify-and-test
    if: always() && github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Evaluate test results and semver policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CI_RESULT: ${{ needs.verify-and-test.result }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PREV_VER: ${{ steps.metadata.outputs.previous-version }}
          NEW_VER: ${{ steps.metadata.outputs.new-version }}
        run: |
          if [ "$ECOSYSTEM" = "pip" ] && [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then
            gh pr comment "$PR_URL" --body "⚠️ **Automated Dependabot Triage — Closed (semver-major)**: Unrequested major version bump for **$DEP_NAMES ($PREV_VER -> $NEW_VER)**. Major breaking library upgrades require an explicit specification review under CONSTITUTION.md."
            gh pr close "$PR_URL" --delete-branch
            exit 0
          fi
          if [ "$CI_RESULT" != "success" ]; then
            gh pr comment "$PR_URL" --body "❌ **Automated Dependabot Triage — Closed (Test/App Failure)**: Updating **$DEP_NAMES ($PREV_VER -> $NEW_VER)** failed the CI test suite or 20-enquiry application benchmark. Closing PR automatically to protect main."
            gh pr close "$PR_URL" --delete-branch
            exit 1
          fi
          gh pr comment "$PR_URL" --body "✅ **Automated Dependabot Triage — Verified Safe to Merge** — Package **$DEP_NAMES ($PREV_VER -> $NEW_VER)** ($UPDATE_TYPE) was installed in CI and passed all unit, security, FastAPI endpoint, and 20-enquiry benchmark tests."


